<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taha AZR Perfumes</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0c0c;
            --container-bg: #141414;
            --gold: #c5a059;
            --gold-light: #e6c584;
            --text-main: #f9f9f9;
            --text-muted: #888888;
            --border: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط العنوان العلوي للبراند */
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
            background: var(--bg-color);
        }

        header h2 {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* حاوية المنتج الرئيسية */
        .product-container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            flex: 1;
        }

        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                margin: 1.5rem auto;
            }
        }

        /* قسم الصورة (شبيه بـ Verelune) */
        .product-image-wrapper {
            background: var(--container-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* قسم التفاصيل */
        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .product-subtitle {
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .product-description {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            border-right: 2px solid var(--gold);
            padding-right: 1rem;
        }

        /* زر الطلب الفاخر */
        .action-btn {
            display: block;
            width: 100%;
            background-color: var(--gold);
            color: #000;
            text-align: center;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--gold-light);
            transform: translateY(-2px);
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- اسم البراند بالأعلى -->
    <header>
        <h2>Taha AZR Perfumes</h2>
    </header>

    <!-- تفاصيل العطر الفردي -->
    <div class="product-container">
        <!-- صورة العطر البارزة -->
        <div class="product-image-wrapper">
            <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=1000&q=80" alt="اسم العطر">
        </div>

        <!-- تفاصيل ومعلومات العطر -->
        <div class="product-details">
            <h1 class="product-title">اسم العطر الخاص بك</h1>
            <div class="product-subtitle">إصدار فاخر حصري</div>
            
            <p class="product-description">
                عطر استثنائي صُمم خصيصاً ليعكس الحضور الطاغي والفخامة المطلقة. مزيج ساحر يترك انطباعاً لا يُنسى ويدوم طويلاً طوال اليوم.
            </p>

            <!-- زر الطلب المباشر -->
            <a href="https://wa.me/966500000000?text=مرحباً، أرغب في طلب عطر (اسم العطر)" class="action-btn" target="_blank">
                اطلب العطر الآن
            </a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © Taha AZR Perfumes</p>
    </footer>

</body>
</html>
