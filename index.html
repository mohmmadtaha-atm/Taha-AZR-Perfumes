<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taha AZR Perfumes</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #999999;
            --border: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(to bottom, #111, var(--bg-color));
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .grid-perfumes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .perfume-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .perfume-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
        }

        .perfume-img-box {
            width: 100%;
            height: 350px;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .perfume-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .perfume-card:hover .perfume-img-box img {
            transform: scale(1.05);
        }

        .perfume-info {
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .perfume-info h3 {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            color: var(--gold-light);
            margin-bottom: 0.8rem;
        }

        .perfume-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .order-btn {
            display: inline-block;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .order-btn:hover {
            background: var(--gold);
            color: #000;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Taha AZR Perfumes</h1>
        <p>عطور فاخرة تعكس هويتك</p>
    </header>

    <div class="container">
        <div class="grid-perfumes">
            
            <!-- العطر الأول (انسخ هذا المربع وكرره لكل عطر عندك) -->
            <div class="perfume-card">
                <div class="perfume-img-box">
                    <!-- ضع هنا رابط صورة العطر أو اسم ملف الصورة المرفوعة -->
                    <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80" alt="اسم العطر الأول">
                </div>
                <div class="perfume-info">
                    <div>
                        <h3>اسم العطر الأول</h3>
                        <p>وصف مختصر أو مكونات العطر المميزة التي تجذب الزبون.</p>
                    </div>
                    <a href="https://wa.me/966500000000?text=مرحباً، أرغب في الاستفسار أو طلب العطر الأول" class="order-btn" target="_blank">اطلب الآن</a>
                </div>
            </div>

            <!-- العطر الثاني -->
            <div class="perfume-card">
                <div class="perfume-img-box">
                    <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80" alt="اسم العطر الثاني">
                </div>
                <div class="perfume-info">
                    <div>
                        <h3>اسم العطر الثاني</h3>
                        <p>وصف مختصر أو مكونات العطر المميزة.</p>
                    </div>
                    <a href="https://wa.me/966500000000?text=مرحباً، أرغب في الاستفسار أو طلب العطر الثاني" class="order-btn" target="_blank">اطلب الآن</a>
                </div>
            </div>

            <!-- العطر الثالث -->
            <div class="perfume-card">
                <div class="perfume-img-box">
                    <img src="https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=600&q=80" alt="اسم العطر الثالث">
                </div>
                <div class="perfume-info">
                    <div>
                        <h3>اسم العطر الثالث</h3>
                        <p>وصف مختصر أو مكونات العطر المميزة.</p>
                    </div>
                    <a href="https://wa.me/966500000000?text=مرحباً، أرغب في الاستفسار أو طلب العطر الثالث" class="order-btn" target="_blank">اطلب الآن</a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © Taha AZR Perfumes 2026</p>
    </footer>

</body>
</html>
